[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inner-speech-trigger-benchmark"
version = "0.1.0"
description = "A forward-block benchmark separating cued inner-speech content decoding from autonomous output triggering."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "threadpoolctl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
inner-speech-benchmark = "inner_speech_benchmark.cli:benchmark_main"
inner-speech-report = "inner_speech_benchmark.cli:report_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

